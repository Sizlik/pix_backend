services:
  database:
    image: postgres
    ports:
      - 5431:5432
    env_file:
      - .env
    volumes:
      - ./db_data:/var/lib/postgresql/data/
    restart: always

  frontend:
    image: frontend_v2:latest
    ports:
      - 3000:3000
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
    image: backend:latest
    network_mode: "host"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_started
      minio:
        condition: service_healthy
    restart: always

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - pix-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    env_file:
      - .env
    volumes:
      - pgadmin-data:/var/lib/pgadmin

