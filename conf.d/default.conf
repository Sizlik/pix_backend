upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

upstream pgadmin {
    server pgadmin:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=operator_chat_rest:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=operator_chat_ws:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;

    server_name pixlogistic.com www.pixlogistic.com;
    server_tokens off;

    location / {
        return 301 https://pixlogistic.com$request_uri;
    }
}

server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name pixlogistic.com www.pixlogistic.com;

    ssl_certificate /etc/nginx/ssl/live/pixlogistic.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/pixlogistic.com/privkey.pem;

    location / {
    	proxy_pass http://frontend;
    }

    location ^~ /api_v1/integration/webhooks/order-chat/ {
        access_log off;
        proxy_pass http://backend;
    }

    location = /api_v1/chat/operator/inbox/ws {
        limit_req zone=operator_chat_ws burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api_v1/chat/operator/ws {
        limit_req zone=operator_chat_ws burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api_v1/chat/operator/ {
        client_max_body_size 205m;
        limit_req zone=operator_chat_rest burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api_v1/chat/orders/ {
        client_max_body_size 205m;
        proxy_pass http://backend;
    }

    location /api_v1/notifications/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api_v1/ {
        proxy_pass http://backend;
    }

    location /api_v1/chat/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pgadmin/ {
        proxy_pass http://pgadmin;
    }
}
